<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VirtualClass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header>
        <div class="logo">VirtualClass</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-container">

        <div class="auth-info">
            <span class="badge">WELCOME BACK</span>
            <h1>Continue Your<br><span>Learning Journey.</span></h1>
            <p>Sign in to access your classes, notes, discussions, and announcements.</p>
        </div>

        <div class="auth-card">
            <h2>Sign In</h2>
            <p class="muted">Enter your account details below.</p>

            <form action="#" method="get">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required>

                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="">Select your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>

                <button type="submit" class="btn btn-primary full-width">
                    Sign In
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>

    </main>

    <footer>
        <p>© 2026 VirtualClass</p>
    </footer>

</body>
</html>
